<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121;">
    0	UNSENT	Client has been created. open() not called yet.
1	OPENED	open() has been called.
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
3	LOADING	Downloading; responseText holds partial data.
4	DONE	The operation is complete.
</body>
<script>
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
    // XMLHttpRequest() : ek method hai jo api request ko  send or receive kr skte hai
    const xhr = new XMLHttpRequest();
    xhr.open('GET', requestUrl) 
    // open ko call bhi krna pdega
    xhr.onreadystatechange = function(){// readyState ko continously check krne ke liye
    console.log(xhr.readyState);
    if(xhr.readyState === 4){
        const data = this.responseText;
        console.log(data);
        console.log(typeof data) // string // jb bhi url se response aata hai vo most of the time string me hi hoga
        console.log(data.followers);
        
        const newData = JSON.parse(this.responseText)// JSON.parse() is used to convert the string to a real JavaScript object.
        console.log(typeof newData); // object
        console.log(newData.followers);
    }
    }
    xhr.send() // open ko call krne ke liye

// niche se smj skta hai sara code
    // https://chatgpt.com/share/685cb2f9-f9e4-8006-ac66-491bd4f041c5 
    
</script>
</html>
